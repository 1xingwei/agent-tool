[project]
name = "agent-service-toolkit"
version = "0.1.0"
description = "Full toolkit for running an AI agent service built with LangGraph, FastAPI and Streamlit"
readme = "README.md"
authors = [{ name = "Joshua Carroll", email = "carroll.joshk@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

requires-python = ">=3.12,<3.15"

dependencies = [
    "aiosqlite >=0.22.1",
    "docx2txt ~=0.8",
    "fastapi ~=0.141.0",
    "httpx ~=0.28.1",
    "jiter ~=0.16.0",
    "langchain ~=1.3.11",
    "langchain-core ~=1.4.8",
    "langchain-community ~=0.4.2",
    "langchain-anthropic ~=1.4.8",
    "langchain-aws ~=1.6.1",
    "langchain-chroma ~=1.1.0",
    "langchain-google-genai ~=4.2.6",
    "langchain-google-vertexai>=3.2.4",
    "langchain-groq ~=1.1.3",
    "langchain-ollama ~=1.1.0",
    "langchain-openai ~=1.3.3",
    "langfuse ~=4.12",
    "langgraph ~=1.2.7",
    "langgraph-checkpoint-mongodb ~=0.4.0",
    "langgraph-checkpoint-postgres~=3.1.1",
    "langgraph-checkpoint-redis ~=0.5.2",
    "langgraph-checkpoint-sqlite ~=3.1.0",
    "langgraph-supervisor ~=0.0.31",
    "langsmith ~=0.11.0",
    "numexpr ~=2.14.1",
    "numpy ~=2.5.0",
    "onnxruntime ~= 1.27.0",
    "pandas ~=3.0.3",
    "psycopg[binary,pool] ~=3.3.4",
    "pyarrow >=23.0.1",
    "pydantic ~=2.13.4",
    "pydantic-settings ~=2.15.0",
    "pypdf>=6.14.2,<6.17.0",
    "pyowm ~=3.5.0",
    "python-dotenv ~=1.2.2",
    "setuptools ~=84.0.0",
    "streamlit ~=1.59.1",
    "tiktoken >=0.13.0",
    "uvicorn ~=0.52.0",
    "langchain-mcp-adapters>=0.3.0",
    "ddgs>=9.14.4",
    "ag-ui-langgraph~=0.0.42",
]

# 供应链冷却期：解析时仅考虑发布满 14 天的版本。需要
# 仓库固定的 uv 版本（旧版 uv 会忽略此项并在重新 lock 时将其从 uv.lock 中移除）。
[tool.uv]
exclude-newer = "14 days"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-env",
    "pytest-asyncio",
    "ruff ~=0.15.21",
    "pyrefly ~=1.1.1",
    "pymarkdownlnt",
]

# 仅运行客户端和 Streamlit 应用所需的最小依赖组。
# 这些依赖也会安装在默认依赖中。
# 安装命令：`uv sync --frozen --only-group client`
client = [
    "httpx~=0.28.1",
    "pydantic ~=2.13.4",
    "python-dotenv ~=1.2.2",
    "streamlit~=1.59.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "U"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
# 只在 tests/ 下收集用例。var/ 是 gitignore 的临时目录，会放下载来的
# 第三方仓库副本与探针脚本；不加这一行，裸跑 pytest 会把它们的测试一起收进来。
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.pytest_env]
OPENAI_API_KEY = "sk-fake-openai-key"

[tool.pymarkdown]
# 文档使用长而不换行的散文行，而非在固定列处硬换行，
# 因此不强制行长限制。
plugins.md013.enabled = false
# README.md 中刻意使用了内联 HTML（例如带 width= 的 <img>）。
plugins.md033.enabled = false
# 并非每个文档都需要以顶级标题开头。
plugins.md041.enabled = false
# 允许重复的标题文本，只要它们不是相邻的兄弟节点。
plugins.md024.siblings_only = true

[tool.pyrefly]
project-includes = ["src"]
project-excludes = ["src/streamlit_app.py"]
preset = "default"

[tool.pyrefly.errors]
# LangGraph 的 StateGraph(state_schema) 泛型约束会拒绝 MessagesState
# 的子类，因此每个 agent 的 StateGraph(AgentState) 都会触发此警告。这是
# LangGraph 类型标注的缺陷，而非真正的错误，因此在项目范围内禁用。
bad-specialization = false
